name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger so release readiness can re-verify CI from a clean
  # checkout without pushing a throwaway commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the sibling dependency so the same MCP commit always tests the
      # same widget source. Update this revision deliberately after validation.
      - name: Fetch widget core
        shell: bash
        run: |
          git clone https://github.com/acsdd/toolbox-widgets.git ../toolbox-widgets
          git -C ../toolbox-widgets checkout --detach 146b9ba5446575d36263c835b503608c218944d1

      - name: Install widget core deps
        run: npm install --omit=dev
        working-directory: ../toolbox-widgets

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm test
